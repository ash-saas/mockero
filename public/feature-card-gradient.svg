<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">

  
  <!-- Gradient glow effect at the bottom of the card -->
  <defs>
    <radialGradient id="glowGradient" cx="50%" cy="75%" r="60%" fx="30%" fy="85%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b33" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Apply the glow effect inside the card -->
  <circle cx="250" cy="400" r="180" fill="url(#glowGradient)" />
  
  <!-- Subtle ambient glow around the card -->
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#121216" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <circle cx="250" cy="300" r="300" fill="url(#ambientGlow)" />
</svg>